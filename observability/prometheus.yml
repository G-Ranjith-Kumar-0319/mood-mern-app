# Prometheus scrapes GET /metrics from every API replica.
# Docker's DNS returns one A record per replica of the "api" service, so replicas
# added with `--scale api=N` are discovered automatically.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: expression-api
    dns_sd_configs:
      - names: ['api']
        type: A
        port: 5000
        refresh_interval: 15s
