# Production configuration: TLS termination + HTTP→HTTPS redirect + load balancing.
# Certificates are mounted at /etc/nginx/certs (see docker-compose.prod.yml).

# Docker's embedded DNS. Re-resolving every 10 s means scaled-up/restarted API
# replicas (new IPs) join the pool without restarting Nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_upstream {
    # Docker DNS resolves "api" to every replica; requests are spread round-robin.
    zone api_upstream 64k;
    server api:5000 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
}

log_format main_with_request_id '$remote_addr - [$time_local] "$request" $status '
                                '$body_bytes_sent rt=$request_time urt=$upstream_response_time '
                                'upstream=$upstream_addr request_id=$request_id';

# Plain HTTP only redirects to HTTPS.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# Internal health endpoint for the container healthcheck (not published).
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /nginx-health {
        return 200 "ok\n";
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log main_with_request_id;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Server-Sent Events: a response that stays open for hours. Nginx must pass each
    # event through immediately (no buffering) and not time out an idle-looking stream.
    location = /api/v1/expressions/events {
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /models/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
