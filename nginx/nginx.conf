# Local / Docker Compose configuration (plain HTTP on localhost — browsers treat
# http://localhost as a secure context, so the camera works). Production uses
# nginx.prod.conf, which adds TLS.

# Docker's embedded DNS returns one IP per API replica; Nginx load-balances across
# all of them (round-robin) and passively marks failing ones as down for 10 s.
# Re-resolving every 10 s means scaled-up/restarted replicas join without an Nginx restart.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_upstream {
    zone api_upstream 64k;
    server api:5000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# WebRTC signaling: both peers of a camera session (laptop + phone) must reach the
# SAME API instance, because live presence is kept in that instance's memory.
# Hashing the (non-secret) sessionId query parameter guarantees it, and also gives
# Socket.IO's long-polling fallback the sticky routing it requires.
# Plain "hash", not "hash … consistent": with a shared-memory zone (needed for
# "resolve"), Nginx 1.29 silently falls back to round-robin for consistent hashing
# (verified). The trade-off: scaling the API reshuffles which instance owns a session,
# so pairings in progress at that moment need a new QR code.
upstream signaling_upstream {
    zone signaling_upstream 64k;
    hash $arg_sessionId;
    server api:5000 resolve max_fails=3 fail_timeout=10s;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

log_format main_with_request_id '$remote_addr - [$time_local] "$request" $status '
                                '$body_bytes_sent rt=$request_time urt=$upstream_response_time '
                                'upstream=$upstream_addr request_id=$request_id';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log main_with_request_id;

    # The largest legitimate request (an auth form or a detection) is < 1 KB.
    client_max_body_size 16k;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Server-Sent Events: a response that stays open for hours. Nginx must pass each
    # event through immediately (no buffering) and not time out an idle-looking stream.
    location = /api/v1/expressions/events {
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # WebRTC signaling (Socket.IO over WebSocket; wss:// behind TLS).
    location /socket.io/ {
        include /etc/nginx/snippets/proxy-signaling.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_read_timeout 30s;
    }

    # Vite emits content-hashed file names, so these can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /models/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # SPA: unknown paths fall back to index.html so React Router can handle them.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
