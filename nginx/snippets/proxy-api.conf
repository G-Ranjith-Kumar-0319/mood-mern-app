# Shared reverse-proxy settings for /api → Node upstream.

proxy_pass http://api_upstream;
proxy_http_version 1.1;
# Empty Connection header enables upstream keep-alive (connection reuse to Node).
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Nginx generates a unique id; the API logs it and echoes it back (end-to-end tracing).
proxy_set_header X-Request-Id $request_id;

proxy_connect_timeout 5s;
# If an instance is down/restarting, retry the request on another one.
# (Nginx never retries non-idempotent POST/DELETE requests by default.)
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;
