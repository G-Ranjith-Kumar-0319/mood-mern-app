# Shared settings for /socket.io/ → Node (WebRTC signaling for the phone camera).
# Only small offer/answer/ICE messages pass here; the video goes phone → laptop directly.

proxy_pass http://signaling_upstream;
proxy_http_version 1.1;
# WebSocket upgrade ($connection_upgrade is "upgrade", or empty for long-polling requests).
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;

proxy_connect_timeout 5s;
# Socket.IO pings every 25 s, so a healthy socket is never idle this long.
proxy_read_timeout 120s;
proxy_send_timeout 120s;
proxy_buffering off;
