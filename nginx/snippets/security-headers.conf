# Included in every `location` (Nginx drops inherited add_header directives
# as soon as a location defines its own, so they are kept in one snippet).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The app may use the camera on its own origin only; never the microphone or location.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
# - style-src 'unsafe-inline': MUI/Emotion injects <style> tags at runtime.
# - blob:/data:: TensorFlow.js and the camera preview use in-memory URLs.
# - connect-src 'self': the browser may only talk to this origin (model weights + API).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
