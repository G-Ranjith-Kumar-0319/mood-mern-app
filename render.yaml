# Render Blueprint: https://render.com/docs/blueprint-spec
# One web service = React app + REST API + Socket.IO signaling on one HTTPS URL.
# MongoDB is external (MongoDB Atlas free tier); enter MONGO_URI when Render asks.
services:
  - type: web
    name: mood-mern
    runtime: docker
    dockerfilePath: ./render/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # mongodb+srv://USER:PASSWORD@cluster0.xxxxx.mongodb.net/expression_detector?retryWrites=true&w=majority
      - key: MONGO_URI
        sync: false
      # Random 256-bit values generated by Render on first deploy (never committed).
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Render's proxy sits in front of the app (correct client IPs for rate limiting).
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: LOG_LEVEL
        value: info
      # APP_URL / QR-code URL default to Render's RENDER_EXTERNAL_URL (https://<name>.onrender.com).
      # Optional TURN relay for phones on mobile data / other networks (set in the dashboard):
      - key: TURN_SERVER
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
